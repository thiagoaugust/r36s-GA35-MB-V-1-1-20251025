<?xml version="1.0"?>
<!-- Sistemas extras para os jogos gratuitos de scripts/fetch-freeware.sh.
     Todos usam núcleos libretro 32 bits que já vêm no SYSTEM (/usr/lib/libretro). -->
<systemList>
	<system>
		<name>quake</name>
		<fullname>Quake</fullname>
		<manufacturer>id</manufacturer>
		<release>1996</release>
		<hardware>computer</hardware>
		<path>/storage/roms/ports/quake</path>
		<extension>.pak .PAK</extension>
		<command>emuelecRunEmu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
		<platform>pc</platform>
		<theme>quake</theme>
		<emulators>
			<emulator name="libretro">
				<cores>
					<core default="true">tyrquake</core>
				</cores>
			</emulator>
		</emulators>
	</system>
	<system>
		<name>cavestory</name>
		<fullname>Cave Story</fullname>
		<manufacturer>Studio Pixel</manufacturer>
		<release>2004</release>
		<hardware>computer</hardware>
		<path>/storage/roms/ports/CaveStory</path>
		<extension>.exe .EXE</extension>
		<command>emuelecRunEmu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
		<platform>pc</platform>
		<theme>cavestory</theme>
		<emulators>
			<emulator name="libretro">
				<cores>
					<core default="true">nxengine</core>
				</cores>
			</emulator>
		</emulators>
	</system>
	<system>
		<name>dinothawr</name>
		<fullname>Dinothawr</fullname>
		<manufacturer>libretro</manufacturer>
		<release>2013</release>
		<hardware>computer</hardware>
		<path>/storage/roms/ports/dinothawr</path>
		<extension>.game</extension>
		<command>emuelecRunEmu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
		<platform>pc</platform>
		<theme>dinothawr</theme>
		<emulators>
			<emulator name="libretro">
				<cores>
					<core default="true">dinothawr</core>
				</cores>
			</emulator>
		</emulators>
	</system>
	<system>
		<name>xrick</name>
		<fullname>Rick Dangerous</fullname>
		<manufacturer>Core Design</manufacturer>
		<release>1989</release>
		<hardware>computer</hardware>
		<path>/storage/roms/ports/xrick</path>
		<extension>.zip .ZIP</extension>
		<command>emuelecRunEmu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
		<platform>pc</platform>
		<theme>xrick</theme>
		<emulators>
			<emulator name="libretro">
				<cores>
					<core default="true">xrick</core>
				</cores>
			</emulator>
		</emulators>
	</system>
</systemList>
