# 10-localizacao-br.conf — Localização para o Brasil
# Aplicado sobre /storage/.config/emuelec/configs/emuelec.conf (partição p8).
# Formato: chave=valor (uma por linha). Chaves existentes são substituídas;
# chaves novas são adicionadas ao fim do arquivo.

# Idioma da interface do EmulationStation (fábrica: es_MX)
system.language=pt_BR

# Fuso horário (fábrica: America/Mexico_City)
system.timezone=America/Sao_Paulo

# Nome do console na rede (fábrica: UDT) — troque se quiser
system.hostname=R36S

# Desliga atualizações automáticas (fábrica: 1).
# Motivo: este é um fork do EmuELEC para Allwinner A33; uma atualização
# do EmuELEC oficial pode sobrescrever o sistema e deixar o console sem boot.
updates.enabled=0
